[package]
name = "multisensor-lmb-filters-rs"
version = "0.3.0"
edition = "2021"
rust-version = "1.70"
description = "Multi-object tracking using Labeled Multi-Bernoulli filters - Rust port of multisensor-lmb-filters"
authors = ["Nathan Michlo"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/nmichlo/multisensor-lmb-filters-rs"
keywords = ["tracking", "mot", "lmb", "kalman-filter", "sensor-fusion"]
categories = ["science", "algorithms"]

[lib]
name = "multisensor_lmb_filters_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Linear algebra
nalgebra = "0.33"

# Stack-allocated small vectors
smallvec = "1.11"

# Random number generation
rand = "0.8"
rand_distr = "0.4"

# Serialization (for test fixtures)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
log = "0.4"

# CLI — only used by the `benchmark_single` bin, gated behind the `cli` feature
# so library consumers (and the lib/bench builds) don't compile clap.
clap = { version = "4.5", features = ["derive"], optional = true }

# Profiling (optional)
hotpath = { version = "0.7", optional = true }

# Python bindings (optional)
pyo3 = { version = "0.23", optional = true, features = ["extension-module", "abi3-py312", "multiple-pymethods"] }
numpy = { version = "0.23", optional = true }

[dev-dependencies]
# Testing
approx = "0.5"      # Floating point comparisons

# Benchmarking
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "lmb_filters"
harness = false

[features]
default = []
# CLI deps for the benchmark_single bin (clap). Off by default so library
# consumers don't pay clap's compile cost.
cli = ["dep:clap"]
python = ["dep:pyo3", "dep:numpy"]
hotpath = ["dep:hotpath", "hotpath/hotpath"]
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc"]

[[bin]]
name = "benchmark_single"
path = "scripts/bench_cross_lang/_run_rust.rs"
required-features = ["cli"]

[profile.release]
lto = true
codegen-units = 1